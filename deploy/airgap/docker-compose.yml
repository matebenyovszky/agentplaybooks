# Isolated self-host stack for the no-egress CI job.
#
# Images must already be present (pulled or built) before `compose up`.
# The airgap network has `internal: true`, so containers have no external
# route. DNS is the observer, which answers only compose service names.
name: airgap

networks:
  airgap:
    name: airgap
    driver: bridge
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24

x-airgap-dns: &airgap-dns
  dns:
    - 172.30.0.53
  dns_search:
    - airgap
  networks:
    airgap: {}

services:
  observer:
    image: agentplaybooks-observer:no-egress
    pull_policy: never
    init: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      airgap:
        ipv4_address: 172.30.0.53
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "53"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  db:
    <<: *airgap-dns
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/zz-roles.sql:ro
    networks:
      airgap:
        ipv4_address: 172.30.0.10
    depends_on:
      observer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth:
    <<: *airgap-dns
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://kong:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: http://app:3000
      GOTRUE_URI_ALLOW_LIST: http://app:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: http://kong:8000
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
    networks:
      airgap:
        ipv4_address: 172.30.0.12
    depends_on:
      observer:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  db-init:
    <<: *airgap-dns
    image: supabase/postgres:17.6.1.136
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../supabase/schema.sql:/schema.sql:ro
      - ./pre-schema.sql:/pre-schema.sql:ro
      - ./grants.sql:/grants.sql:ro
    networks:
      airgap:
        ipv4_address: 172.30.0.17
    depends_on:
      observer:
        condition: service_healthy
      auth:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        i=0
        while [ "$$i" -lt 60 ]; do
          if pg_isready -h db -U postgres >/dev/null 2>&1; then
            break
          fi
          i=$$((i + 1))
          sleep 2
        done
        i=0
        while [ "$$i" -lt 60 ]; do
          if psql -h db -U postgres -d postgres -tAc "select to_regclass('auth.users')" | grep -q users; then
            break
          fi
          i=$$((i + 1))
          sleep 2
        done
        psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /pre-schema.sql
        psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /schema.sql
        psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /grants.sql

  rest:
    <<: *airgap-dns
    image: postgrest/postgrest:v14.18
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
    networks:
      airgap:
        ipv4_address: 172.30.0.11
    depends_on:
      observer:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  kong:
    <<: *airgap-dns
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      airgap:
        ipv4_address: 172.30.0.13
        aliases:
          - kong
    depends_on:
      observer:
        condition: service_healthy
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  echo:
    <<: *airgap-dns
    image: nginx:1.27-alpine
    volumes:
      - ./echo.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      airgap:
        ipv4_address: 172.30.0.15
    depends_on:
      observer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    <<: *airgap-dns
    image: agentplaybooks-app:no-egress
    pull_policy: never
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://kong:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_APP_URL: http://app:3000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://app:3000}
      SECRETS_REQUIRE_ALLOWED_HOSTS: "true"
      NO_EGRESS: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      airgap:
        ipv4_address: 172.30.0.14
    depends_on:
      observer:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  tester:
    <<: *airgap-dns
    image: agentplaybooks-tester:no-egress
    pull_policy: never
    environment:
      ANON_KEY: ${ANON_KEY}
      APP_URL: http://app:3000
      KONG_URL: http://kong:8000
    networks:
      airgap:
        ipv4_address: 172.30.0.16
    depends_on:
      observer:
        condition: service_healthy
      app:
        condition: service_healthy
      echo:
        condition: service_healthy
