# Kong-lite: the paths supabase-js expects, stripped onto GoTrue and PostgREST.
# No telemetry, no dashboard, no extra upstreams.
daemon off;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  upstream gotrue { server auth:9999; }
  upstream postgrest { server rest:3000; }
  server {
    listen 8000;
    location = / {
      default_type text/plain;
      return 200 'ok\n';
    }
    location /auth/v1/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_pass http://gotrue/;
    }
    location /rest/v1/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_pass http://postgrest/;
    }
  }
}
