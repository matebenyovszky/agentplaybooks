# Resolve only the air-gapped compose services. No upstream resolvers, so an
# external name is NXDOMAIN and is logged rather than forwarded.
no-resolv
no-hosts
addn-hosts=/etc/airgap.hosts
domain=airgap
expand-hosts
local=/airgap/
bind-interfaces
listen-address=0.0.0.0
port=53
log-queries
log-facility=/var/log/airgap/dnsmasq.log
cache-size=0
bogus-priv
domain-needed
