# Terminate TLS, verify client certificates against a private CA, and forward
# the verified identity to AgentPlaybooks. proxy_set_header overwrites any
# client-supplied copy of these headers — never pass $http_x_ssl_client_*.
#
# ssl_verify_client optional keeps browser and API-key traffic working on the
# same hostname. Use "on" only on a dedicated runtime hostname.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    server_tokens off;
    client_max_body_size 8m;
    large_client_header_buffers 4 16k;

    upstream agentplaybooks {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://agentplaybooks;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;

            # Stock nginx $ssl_client_fingerprint is SHA-1. Forward the escaped
            # PEM instead; the origin hashes the DER to SHA-256.
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-Fingerprint $ssl_client_escaped_cert;
            proxy_set_header X-APB-Proxy-Token "${MTLS_PROXY_SHARED_SECRET}";
            proxy_set_header X-APB-Proxy-Address $server_addr;
        }
    }
}
