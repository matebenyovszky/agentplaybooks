<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playbook layout fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    .shell {
      min-height: 100vh;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
      background: #0a0f1a;
      color: #f1f5f9;
    }
    .desktop-sidebar {
      display: none;
      width: 72px;
      flex-shrink: 0;
      background: #070b14;
      border-right: 1px solid rgba(30, 58, 138, 0.3);
    }
    .mobile-bar {
      display: flex;
      width: 100%;
      flex-shrink: 0;
      height: 2.5rem;
      align-items: center;
      justify-content: flex-end;
      padding: 0 1rem;
      background: #070b14;
      border-bottom: 1px solid rgba(30, 58, 138, 0.3);
    }
    .main {
      flex: 1 1 0%;
      min-width: 0;
      width: 100%;
      padding: 1rem;
      overflow-x: clip;
      overflow-y: auto;
    }
    .inner {
      max-width: 72rem;
      margin: 0 auto;
      min-width: 0;
      width: 100%;
    }
    .description {
      min-width: 0;
      width: 100%;
      padding: 1.25rem;
      border-radius: 0.75rem;
      background: linear-gradient(to bottom right, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.8));
      border: 1px solid rgba(51, 65, 85, 0.5);
      overflow-wrap: anywhere;
    }
    @media (min-width: 768px) {
      .shell { flex-direction: row; }
      .desktop-sidebar { display: flex; }
      .mobile-bar { display: none; }
      .main { padding: 2rem; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="desktop-sidebar" data-testid="desktop-sidebar"></aside>
    <div class="mobile-bar" data-testid="mobile-bar">☰</div>
    <main class="main">
      <div class="inner">
        <section data-testid="playbook-description" class="description">
          <div>Description</div>
          <p>
            Complete toolkit for modern full-stack development with Next.js, TypeScript, and Supabase
          </p>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
