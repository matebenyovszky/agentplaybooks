name: Python secrets library

on:
  pull_request:
    paths:
      - "packages/python-secrets/**"
      - "packages/cli/skills/agentplaybooks/scripts/store-vault-secret.*"
      - "packages/cli/test/test_store_vault_secret.py"
      - "packages/cli/test/store-vault-secret.test.ps1"
      - "src/app/api/**"
      - "src/lib/mtls*"
      - ".github/workflows/python-secrets.yml"
  push:
    branches: [main]
    paths:
      - "packages/python-secrets/**"
      - "packages/cli/skills/agentplaybooks/scripts/store-vault-secret.*"
      - "packages/cli/test/test_store_vault_secret.py"
      - "packages/cli/test/store-vault-secret.test.ps1"
      - "src/app/api/**"
      - "src/lib/mtls*"
      - ".github/workflows/python-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: PowerShell 7 helper (offline)
        shell: pwsh
        run: ./packages/cli/test/store-vault-secret.test.ps1
      - name: Windows PowerShell 5.1 helper (offline)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./packages/cli/test/store-vault-secret.test.ps1
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./packages/python-secrets
      - run: python -m unittest discover -s packages/python-secrets/tests -v
      - name: Hidden-input vault helper (offline)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s packages/cli/test -p test_store_vault_secret.py -v
      - name: Existing CI environment needs no APBKS credentials
        env:
          DATABASE_URL: fixture-db
          SERVICE_API_KEY: fixture-service
        run: python packages/python-secrets/examples/app.py
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps ./packages/python-secrets --wheel-dir dist
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.13'
        with:
          name: agentplaybooks-secrets-wheel
          path: dist/*.whl
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f packages/python-secrets/examples/Dockerfile -t apb-secrets-example .
      - name: Existing container environment needs no APBKS credentials
        run: docker run --rm -e DATABASE_URL=fixture-db -e SERVICE_API_KEY=fixture-service apb-secrets-example
