name: Python secrets library

on:
  pull_request:
    paths:
      - "packages/python-secrets/**"
      - "src/app/api/**"
      - "src/lib/mtls*"
      - ".github/workflows/python-secrets.yml"
  push:
    branches: [main]
    paths:
      - "packages/python-secrets/**"
      - "src/app/api/**"
      - "src/lib/mtls*"
      - ".github/workflows/python-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./packages/python-secrets
      - run: python -m unittest discover -s packages/python-secrets/tests -v
      - name: Existing CI environment needs no APBKS credentials
        env:
          DATABASE_URL: fixture-db
          SERVICE_API_KEY: fixture-service
        run: python packages/python-secrets/examples/app.py
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps ./packages/python-secrets --wheel-dir dist
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: agentplaybooks-secrets-wheel
          path: dist/*.whl
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f packages/python-secrets/examples/Dockerfile -t apb-secrets-example .
      - name: Existing container environment needs no APBKS credentials
        run: docker run --rm -e DATABASE_URL=fixture-db -e SERVICE_API_KEY=fixture-service apb-secrets-example
