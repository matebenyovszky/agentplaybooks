name: Hermes skills and tools plugin

on:
  schedule:
    - cron: "23 7 * * 1"
  pull_request:
    paths: ["packages/hermes-portable/**", ".github/workflows/hermes-tools.yml"]
  push:
    branches: [main]
    paths: ["packages/hermes-portable/**", ".github/workflows/hermes-tools.yml"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        hermes: ["v0.22.4", "v0.22.5", "main"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: .tmp/hermes-upstream
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install Hermes from its committed lockfile
        run: |
          # Respect upstream security overrides and use the exact release lock.
          uv sync --project .tmp/hermes-upstream --frozen --no-dev --python "$(command -v python)"
          echo "$GITHUB_WORKSPACE/.tmp/hermes-upstream/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate package and discover bundled Hermes skill
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-tools-validation
          PYTHONPATH: ${{ github.workspace }}/.tmp/hermes-upstream
        run: |
          python -m hermes_cli.main plugins validate packages/hermes-portable/agentplaybooks-tools
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from hermes_cli.agent_plugins import load_agent_plugin

          root = Path("packages/hermes-portable/agentplaybooks-tools").resolve()
          with TemporaryDirectory() as data:
              package = load_agent_plugin(root, Path(data))
              assert package.name == "agentplaybooks-tools"
              assert [skill.name for skill in package.skills] == ["agentplaybooks-tools"]
              assert not package.diagnostics, package.diagnostics
          PY
