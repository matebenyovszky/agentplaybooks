name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published npm release tag, for example cli-v0.7.0"
        required: true
        type: string
  workflow_run:
    workflows: ["Publish CLI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry-publish
    steps:
      # Only JSON metadata is loaded from the release. No release-tag code is
      # executed in this privileged job. The environment allows protected branches.
      - name: Validate release and prepare metadata
        id: metadata
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            let tag = process.env.RELEASE_TAG;
            const readJson = async (ref, file) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, ref, path: file });
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64') {
                throw new Error(`Expected JSON file: ${file}`);
              }
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };
            if (!tag) {
              const pkg = await readJson(context.payload.workflow_run.head_sha, 'packages/cli/package.json');
              tag = `cli-v${pkg.version}`;
            }
            if (!/^cli-v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error('Expected a cli-vX.Y.Z release tag.');
            }
            let { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            let object = ref.object;
            for (let depth = 0; object.type === 'tag' && depth < 4; depth++) {
              const { data } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
              object = data.object;
            }
            if (object.type !== 'commit') throw new Error('Tag must resolve to a commit.');
            if (context.eventName === 'workflow_run' && object.sha !== context.payload.workflow_run.head_sha) {
              throw new Error('Release tag does not match the successful npm publishing run.');
            }
            const { data: comparison } = await github.rest.repos.compareCommits({ owner, repo, base: object.sha, head: 'main' });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Release commit must be contained in main.');
            }
            const pkg = await readJson(object.sha, 'packages/cli/package.json');
            const manifest = await readJson(object.sha, 'server.json');
            const version = tag.slice('cli-v'.length);
            if (pkg.name !== '@agentplaybooks/cli' || pkg.version !== version || manifest.version !== version ||
                manifest.name !== 'ai.agentplaybooks/agentplaybooks' ||
                manifest.remotes?.[0]?.url !== 'https://agentplaybooks.ai/api/mcp/manage') {
              throw new Error('Release package, registry namespace, endpoint, or versions do not match.');
            }
            // npm's successful publish can precede availability on its read replicas.
            // Retry only propagation/transient errors; never bypass version validation.
            for (let attempt = 0; ; attempt++) {
              const response = await fetch(`https://registry.npmjs.org/@agentplaybooks%2Fcli/${encodeURIComponent(version)}`);
              if (response.ok) {
                if ((await response.json()).version !== version) throw new Error('npm returned a different release version.');
                break;
              }
              if (attempt === 5 || ![404, 429, 500, 502, 503, 504].includes(response.status)) {
                throw new Error(`Publish to npm before publishing its MCP Registry metadata (HTTP ${response.status}).`);
              }
              core.info(`Waiting for npm release propagation (${attempt + 1}/5).`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            const registryUrl = `https://registry.modelcontextprotocol.io/v0.1/servers/${encodeURIComponent(manifest.name)}/versions/${encodeURIComponent(version)}`;
            const existing = await fetch(registryUrl);
            if (existing.ok) {
              const entry = await existing.json();
              if (entry._meta?.['io.modelcontextprotocol.registry/official']?.status !== 'active') {
                throw new Error('This version already exists but is not active; review it manually.');
              }
              core.setOutput('exists', 'true');
              await core.summary.addLink(`Already published: ${manifest.name} ${version}`, registryUrl).write();
              return;
            }
            if (existing.status !== 404) throw new Error(`Registry preflight failed: ${existing.status}`);
            const directory = path.join(process.env.RUNNER_TEMP, 'mcp-registry-publish');
            fs.mkdirSync(directory, { recursive: true });
            fs.writeFileSync(path.join(directory, 'server.json'), JSON.stringify(manifest, null, 2) + '\n');
            core.setOutput('directory', directory);
            core.setOutput('registry_url', registryUrl);

      - name: Check publisher key is configured
        if: steps.metadata.outputs.exists != 'true'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo 'Set MCP_REGISTRY_PRIVATE_KEY in the protected mcp-registry-publish environment.' >&2
            exit 1
          fi

      - name: Install official publisher with pinned checksum
        if: steps.metadata.outputs.exists != 'true'
        working-directory: ${{ steps.metadata.outputs.directory }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz \
            --output publisher.tar.gz
          printf '%s  publisher.tar.gz\n' 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628 | sha256sum --check --strict
          tar xzf publisher.tar.gz mcp-publisher

      - name: Authenticate and publish
        if: steps.metadata.outputs.exists != 'true'
        working-directory: ${{ steps.metadata.outputs.directory }}
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login http --domain agentplaybooks.ai --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish

      - name: Verify published version
        if: steps.metadata.outputs.exists != 'true'
        uses: actions/github-script@v9
        env:
          REGISTRY_URL: ${{ steps.metadata.outputs.registry_url }}
        with:
          script: |
            const response = await fetch(process.env.REGISTRY_URL);
            if (!response.ok) throw new Error(`Publication verification failed: ${response.status}`);
            const entry = await response.json();
            const official = entry._meta?.['io.modelcontextprotocol.registry/official'];
            if (official?.status !== 'active') throw new Error('Published version is not active.');
            await core.summary
              .addHeading(`Published ${entry.server.name} ${entry.server.version}`)
              .addLink('Verified registry entry', process.env.REGISTRY_URL)
              .addRaw(`\nLatest flag: ${official.isLatest}.\n`)
              .write();

