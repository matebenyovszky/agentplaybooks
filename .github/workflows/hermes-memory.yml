name: Hermes memory plugin

on:
  pull_request:
    paths: ["packages/hermes-memory/**", "packages/cli/**", ".github/workflows/hermes-memory.yml"]
  push:
    branches: [main]
    paths: ["packages/hermes-memory/**", "packages/cli/**", ".github/workflows/hermes-memory.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: 71a2fe399bbd7a219c71f9d9fca2b313b01f2057
          path: .tmp/hermes-upstream
      - run: pip install -e .tmp/hermes-upstream
      - run: pip install ./packages/hermes-memory
      - name: Provider behavior and real Hermes integration
        env:
          HERMES_SOURCE: ${{ github.workspace }}/.tmp/hermes-upstream
          HERMES_HOME: ${{ runner.temp }}/hermes-plugin-validation
          PYTHONPATH: ${{ github.workspace }}/.tmp/hermes-upstream
        run: |
          python -m unittest discover -s packages/hermes-memory/tests -v
          python packages/hermes-memory/tests/verify_hermes.py
          python -c "from importlib.metadata import entry_points; assert any(ep.name == 'agentplaybooks-memory' for ep in entry_points(group='hermes_agent.memory_providers'))"
          hermes plugins validate packages/hermes-memory/agentplaybooks
