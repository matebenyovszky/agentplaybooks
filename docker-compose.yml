# ============================================
# AgentPlaybooks - Docker Compose
# ============================================
#
# The application talks to Supabase (Data API + Auth), not to a database
# directly, so this file runs the app only. Point it at either a hosted
# Supabase project or your own self-hosted Supabase stack:
# https://supabase.com/docs/guides/self-hosting/docker
#
# A bare PostgreSQL container is not enough and is deliberately not included
# here -- see public/docs/self-hosting.md.
#
# On-prem backup of the data plane (Postgres/Supabase including vault tables,
# storage, redacted config; encryption master key stored separately):
# scripts/self-host/backup.sh, restore.sh, and docs/self-host/backup-restore.md.
#
# The air-gapped no-egress proof (isolated network, DNS sink, secrets flow)
# lives in deploy/airgap/ and .github/workflows/no-egress.yml.
#
# Certificate (mTLS) secret loading needs a TLS terminator in front of this
# service: deploy/self-host/docker-compose.mtls.yml and
# public/docs/self-hosted-mtls.md.

services:
  app:
    build:
      context: .
      args:
        # Baked into the client bundle at build time, so this must be the URL
        # the browser can reach. Changing it requires a rebuild, not a restart.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        # This instance's own origin, e.g. https://agents.example.org. Also
        # baked in at build time; left empty, OAuth metadata and generated
        # links fall back to the hosted https://agentplaybooks.ai.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Secrets vault (64 hex characters). Rotating this makes existing
      # secrets undecryptable -- there is no re-encryption tooling yet.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      # Optional. Setting this replaces the default CORS allow-list, which is
      # what a self-hosted instance wants.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # "true" (the self-hosted default) refuses outbound use of any secret
      # that has not declared allowed_hosts. Set "false" to allow unpinned
      # secrets to go to any public host.
      SECRETS_REQUIRE_ALLOWED_HOSTS: ${SECRETS_REQUIRE_ALLOWED_HOSTS:-true}
      # Resolve outbound hostnames and refuse internal addresses before
      # sending a credential (default on). "false" only if egress is enforced
      # at the network layer instead.
      OUTBOUND_DNS_CHECK: ${OUTBOUND_DNS_CHECK:-}
      # Optional. "true" disables optional outbound calls (MCP registry search)
      # unless MCP_REGISTRY_URL points at an internal mirror. Unset keeps the
      # hosted default. See public/docs/self-hosting.md.
      NO_EGRESS: ${NO_EGRESS:-}
      MCP_REGISTRY_URL: ${MCP_REGISTRY_URL:-}
