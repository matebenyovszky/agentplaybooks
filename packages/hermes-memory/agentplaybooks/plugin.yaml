name: agentplaybooks-memory
version: 0.2.0
description: "AgentPlaybooks memory for Hermes: recall, explicit memory writes, archive and history in a private playbook."
author: Mate Benyovszky
kind: exclusive
requires_hermes: ">=0.21.4"
license: MIT
homepage: https://agentplaybooks.ai
# MemoryManager injects the six provider schemas only when selected. No general
# tools or lifecycle hooks are registered by register(ctx).
provides_tools: []
provides_hooks: []
requires_env:
  - name: AGENTPLAYBOOKS_MEMORY_API_KEY
    description: "Playbook-scoped API key with memory:read and memory:write permissions"
    secret: true
    url: https://agentplaybooks.ai/dashboard
